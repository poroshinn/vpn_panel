{% extends "base.html" %}
{% set skip_header = true %}
{% block title %}Change password — {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h3>Change password</h3>
  <form id="cp-form">
    <label class="field"><span>Old password</span>
      <input type="password" id="old-password" autocomplete="current-password" required>
    </label>
    <label class="field"><span>New password</span>
      <input type="password" id="new-password" minlength="8" autocomplete="new-password" required>
    </label>
    <button class="btn" type="submit" style="width:100%">Save</button>
  </form>
  <p id="cp-error" style="color:var(--err)" hidden></p>
</div>
{% endblock %}
{% block scripts %}
<script type="module">
document.getElementById('cp-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resp = await fetch('/api/auth/change-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      old_password: document.getElementById('old-password').value,
      new_password: document.getElementById('new-password').value,
    }),
  });
  if (resp.ok) { location.href = '/'; return; }
  const err = await resp.json().catch(() => ({}));
  const box = document.getElementById('cp-error');
  box.textContent = err.message || 'Failed';
  box.hidden = false;
});
</script>
{% endblock %}
