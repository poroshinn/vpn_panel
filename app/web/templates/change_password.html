<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password — Amnezia Web Panel</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { width: 340px; padding: 2rem; border: 1px solid #8884; border-radius: 12px; }
    h1 { font-size: 1.2rem; margin-top: 0; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #8886; border-radius: 6px; }
    button { margin-top: 1rem; width: 100%; padding: 0.6rem; border: 0; border-radius: 6px; background: #3a6df0; color: #fff; font-size: 1rem; cursor: pointer; }
    .error { color: #c33; margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <form class="card" id="pw-form">
    <h1>Change password</h1>
    <label for="old">Current password</label>
    <input id="old" type="password" autocomplete="current-password" required>
    <label for="new">New password (min 8 chars)</label>
    <input id="new" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Update</button>
    <div class="error" id="error"></div>
  </form>
  <script>
    const form = document.getElementById('pw-form');
    const errorBox = document.getElementById('error');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      errorBox.textContent = '';
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ old_password: form.old.value, new_password: form.new.value }),
      });
      if (res.ok) { location.href = '/'; return; }
      let data;
      try { data = await res.json(); } catch { data = { message: 'HTTP ' + res.status }; }
      errorBox.textContent = data.message || 'Error';
    });
  </script>
</body>
</html>
