<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ t('share.password_required') }}</title>
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body data-theme="light">
  <header class="header">
    <span class="brand">{{ t('app.name') }} — {{ t('share.title') }}</span>
  </header>
  <main class="container">
    <h1>{{ t('share.password_required') }}</h1>
    {% if error == 'wrong_password' %}
    <p class="error">{{ t('share.wrong_password') }}</p>
    {% elif error == 'rate_limited' %}
    <p class="error">{{ t('share.rate_limited') }}</p>
    {% endif %}
    <form method="post" action="/share/{{ token }}">
      <label>
        {{ t('share.password') }}
        <input type="password" name="password" required autofocus autocomplete="current-password">
      </label>
      <button class="btn" type="submit">{{ t('share.continue') }}</button>
    </form>
  </main>
</body>
</html>
