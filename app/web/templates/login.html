{% extends "base.html" %}
{% set skip_header = true %}
{% block title %}{{ t('nav.login') }} — {{ t('app.name') }}{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h3>{{ t('app.name') }}</h3>
  <form id="login-form">
    <label class="field"><span>{{ t('common.user') }}</span>
      <input type="text" id="username" name="username" autocomplete="username" required>
    </label>
    <label class="field"><span>Password</span>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </label>
    <div id="captcha-block" hidden>
      <label class="field"><span>CAPTCHA</span>
        <input type="text" id="captcha-answer" autocomplete="off">
      </label>
      <input type="hidden" id="captcha-id">
    </div>
    <button class="btn" type="submit" style="width:100%">{{ t('nav.login') }}</button>
  </form>
  <p id="login-error" style="color:var(--err)" hidden></p>
</div>
{% endblock %}
{% block scripts %}
<script type="module">
const form = document.getElementById('login-form');
const errBox = document.getElementById('login-error');

async function maybeLoadCaptcha() {
  // CAPTCHA включается настройкой панели; пробуем только после первой 400 captcha_required
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.hidden = true;
  const body = {
    username: document.getElementById('username').value,
    password: document.getElementById('password').value,
  };
  if (!document.getElementById('captcha-block').hidden) {
    body.captcha_id = document.getElementById('captcha-id').value;
    body.captcha_answer = document.getElementById('captcha-answer').value;
  }
  const resp = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (resp.ok) {
    const data = await resp.json();
    location.href = data.must_change_password ? '/change-password' : '/';
    return;
  }
  const err = await resp.json().catch(() => ({}));
  if (err.error_code === 'captcha_required' || err.error_code === 'captcha_failed') {
    document.getElementById('captcha-block').hidden = false;
    const cap = await fetch('/api/auth/captcha').then((r) => r.json()).catch(() => null);
    if (cap) {
      document.getElementById('captcha-id').value = cap.captcha_id;
    }
  }
  errBox.textContent = err.message || 'Login failed';
  errBox.hidden = false;
});
</script>
{% endblock %}
